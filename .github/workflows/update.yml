name: Update prices

on:
  schedule:
    - cron: "*/15 * * * *"   # هر ۱۵ دقیقه (UTC)
  workflow_dispatch:          # اجرای دستی

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape
        run: python scraper.py

      # اگر ساختار سایت عوض شود، HTML خام صفحه‌ی خراب اینجا ذخیره می‌شود
      - name: Upload debug HTML on failure
        if: failure() || hashFiles('debug/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore

      # حتی اگر یک منبع خراب شد، فایل منابع سالم commit می‌شود (job قرمز می‌ماند)
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ history/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
